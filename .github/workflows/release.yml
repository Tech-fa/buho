name: Publish desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # A browser download keeps the quarantine flag. macOS then refuses an
      # unsigned app with “Buho is damaged and can’t be opened.” Developer ID
      # signing plus notarization is what makes the downloaded app open.
      #
      # Secrets, from an Apple Developer account (Developer ID Application,
      # not Apple Development):
      #   APPLE_CERTIFICATE            base64 of the exported .p12
      #                                openssl base64 -A -in certificate.p12
      #   APPLE_CERTIFICATE_PASSWORD   password set when exporting the .p12
      #   APPLE_SIGNING_IDENTITY       optional; inferred from the certificate
      # Notarization, either an app-specific password:
      #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
      # or an App Store Connect API key:
      #   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_BASE64
      #   (base64 of AuthKey_<id>.p8)
      - name: Require macOS signing secrets
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$APPLE_CERTIFICATE" ]] || missing+=("APPLE_CERTIFICATE")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          apple_id_ready=0
          api_key_ready=0
          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            apple_id_ready=1
          fi
          if [[ -n "$APPLE_API_KEY" && -n "$APPLE_API_ISSUER" && -n "$APPLE_API_KEY_BASE64" ]]; then
            api_key_ready=1
          fi
          if [[ "$apple_id_ready" -eq 0 && "$api_key_ready" -eq 0 ]]; then
            missing+=("APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID, or APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_BASE64")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Refusing to publish an unsigned Mac app. macOS reports that download as damaged."
            echo "Missing GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi
          if [[ "$api_key_ready" -eq 1 ]]; then
            if [[ ! "$APPLE_API_KEY" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "APPLE_API_KEY must be the App Store Connect key id."
              exit 1
            fi
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: matrix.platform != 'macos'
        run: npm run tauri build

      - name: Build signed macOS app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              unset "$name"
            fi
          done
          npm run tauri build

      - name: Verify the Mac app is notarized
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle -type f -name '*.dmg' | head -n 1)
          if [[ -z "$dmg" ]]; then
            echo "No DMG was produced."
            exit 1
          fi
          mount="$RUNNER_TEMP/buho-dmg-mount"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          cleanup() { hdiutil detach "$mount" >/dev/null || true; }
          trap cleanup EXIT
          app=$(find "$mount" -maxdepth 2 -type d -name '*.app' | head -n 1)
          if [[ -z "$app" ]]; then
            echo "The DMG does not contain an app."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature"
          case "$signature" in
            *"Authority=Developer ID Application:"*) ;;
            *)
              echo "The app is not signed with a Developer ID Application certificate."
              exit 1
              ;;
          esac
          case "$signature" in
            *"TeamIdentifier=not set"*)
              echo "The app is not signed with a Developer ID certificate."
              exit 1
              ;;
          esac
          xcrun stapler validate "$app"

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p upload
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} upload/ \;
          find upload -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: upload/*
          if-no-files-found: error

  publish:
    name: Upload to S3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist-bundles
          merge-multiple: true

      - name: Resolve the release
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          else
            version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            notes="$(git log -1 --format=%B)"
          fi
          notes="${notes:-Buho ${version}}"
          base="${{ secrets.S3_PUBLIC_BASE_URL }}"
          base="${base:-https://${{ secrets.S3_BUCKET }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com}"
          {
            echo "version=${version}"
            echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "base=${base}"
            echo "notes<<NOTES"
            echo "${notes}"
            echo "NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Write latest.json
        env:
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          node .github/scripts/publish-release.mjs \
            dist-bundles \
            "${{ steps.release.outputs.version }}" \
            "$NOTES" \
            "${{ steps.release.outputs.published_at }}" \
            "${{ steps.release.outputs.base }}" \
            "releases"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload installers and latest.json
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$S3_BUCKET" || { echo "Set the S3_BUCKET secret."; exit 1; }
          aws s3 cp dist-bundles/ "s3://${S3_BUCKET}/releases/${VERSION}/" \
            --recursive \
            --exclude "latest.json" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist-bundles/latest.json "s3://${S3_BUCKET}/releases/latest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"
